# PR / 主干门禁：类型检查 + 构建 + 主测试套件（离线，375ms 量级，无网络依赖）
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build # tsc --noEmit + vite build
      - run: npm test
